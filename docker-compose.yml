services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    command: npm run server
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /app/data/news.sqlite
      HABR_AI_NEWS_RSS_URL: https://habr.com/ru/rss/hubs/artificial_intelligence/news/?fl=ru
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openai.api.proxyapi.ru/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-45000}
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - news_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:8787
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  node_modules:
  news_data:
